name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Nix toolchain cache tag
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            tag="${MIX_HOME##*/}"
            test -n "$tag"
            test "${MIX_BUILD_ROOT##*/}" = "$tag"
            test "${MIX_DEPS_PATH##*/}" = "$tag"
            printf "TOOLCHAIN_TAG=%s\n" "$tag" >> "$GITHUB_ENV"
          '

      - name: Restore Dialyzer PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ai-orchestrator/mix/${{ env.TOOLCHAIN_TAG }}
            _build/${{ env.TOOLCHAIN_TAG }}/dev/dialyz*
          key: dialyzer-${{ runner.os }}-${{ env.TOOLCHAIN_TAG }}-${{ hashFiles('mix.lock') }}

      - name: Verify
        run: nix develop --command bin/verify

      - name: Verify console gate script controls with ExUnit
        run: nix develop --command console/bin/c1-gate-controls

      - name: Evaluate supported Nix outputs
        run: nix flake check --no-build --all-systems

      - name: Build native gate guardian
        run: nix build --no-link .#gate-guardian

  console-verify:
    name: Console qualification (Linux)
    # Jammy supports the browser's user-namespace sandbox without changing the
    # host AppArmor policy or passing --no-sandbox (Noble restricts this by default).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # M-15 compares against the retained public C1 smoke implementation.
          fetch-depth: 0

      - name: Record qualification identity
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/console-ci"
          echo "OUT=$RUNNER_TEMP/console-ci/stages" >> "$GITHUB_ENV"
          echo "C1_BROWSER=$RUNNER_TEMP/c1-browser/chrome-headless-shell-linux64/chrome-headless-shell" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD 'HEAD^{tree}'
            uname -a
            cat /etc/os-release
          } > "$RUNNER_TEMP/console-ci/identity.txt"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Linux browser
        shell: bash
        run: |
          {
            # Runtime packages from this archive's deb.deps, with explicit
            # alternatives selected for Ubuntu 22.04. No npm or browser wrapper.
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y \
              ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 \
              libatk1.0-0 libatspi2.0-0 libc6 libcairo2 libcups2 libcurl4 \
              libdbus-1-3 libexpat1 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 \
              libnss3 libpango-1.0-0 libudev1 libvulkan1 libx11-6 libxcb1 \
              libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 \
              libxrandr2 wget xdg-utils curl unzip procps
            mkdir -p "$RUNNER_TEMP/c1-browser"
            cd "$RUNNER_TEMP/c1-browser"
            curl --fail --location --retry 3 --max-time 180 \
              --output browser.zip \
              https://storage.googleapis.com/chrome-for-testing-public/149.0.7827.55/linux64/chrome-headless-shell-linux64.zip
            echo '410c9407d5de3fea80d9398666be06f2aa09154a3fa7b327dc254e336bb4c4b7  browser.zip' | sha256sum --check
            unzip -q browser.zip
            echo '670ba079b75107746ba41abad131180a31a7c7219aa1bd4061fb471f4535d541  chrome-headless-shell-linux64/chrome-headless-shell' | sha256sum --check
            test "$("$C1_BROWSER" --version)" = 'Google Chrome for Testing 149.0.7827.55'
            "$C1_BROWSER" --version
          } 2>&1 | tee "$RUNNER_TEMP/console-ci/browser-setup.log"

      - name: Fetch locked root dependencies for console escript preservation
        shell: bash
        run: |
          nix develop --command mix deps.get --check-locked \
            2>&1 | tee "$RUNNER_TEMP/console-ci/root-deps.log"

      - name: Run complete console qualification
        shell: bash
        run: |
          # The canonical gate owns OUT; tee must stay outside it because the
          # gate refuses a nonempty evidence directory. Bash pipefail retains RED.
          nix develop --command console/bin/verify \
            2>&1 | tee "$RUNNER_TEMP/console-ci/runner.log"

      - name: Summarize console qualification
        if: always()
        shell: bash
        run: |
          {
            echo '### Console qualification (Linux)'
            if [ -f "$OUT/SUMMARY.txt" ]; then
              echo '```text'
              cat "$OUT/SUMMARY.txt"
              echo '```'
            else
              echo 'Canonical gate did not produce a summary; inspect setup logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain console qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/console-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
